site: seomis home

url: "https://seomis.cc"

collections:
  pages:
    output: true
    permalink: /:name
  posts:
    output: true
    permalink: /blog/:slug

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

markdown: kramdown

include:
  - .well-known

# Build and CV tooling: kept in the repo, not published.
exclude:
  - Makefile
  - scripts
  - templates
  - images/social-icons
  - _pages/resume_pdf.md
  - _README.md
  - _LICENSE.md
  - Gemfile
  - Gemfile.lock
  - vendor

highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    guess_lang: true

sass:
  style: compressed

plugins:
  - jekyll-sitemap
  - jemoji
  - jekyll-feed

